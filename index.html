<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Your Custom Portfolio</title>
    
    <!-- Official PhotoSwipe CSS -->
    <link rel="stylesheet" href="https://unpkg.com/photoswipe@5/dist/photoswipe.css">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display&display=swap" rel="stylesheet">

    <style>
        /* Base Reset and Styling */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #ffffff;
            color: #333333;
            font-family: 'Playfair Display', Helvetica, Arial, sans-serif;
            line-height: 1.6;
            padding: 20px 40px 40px 40px; 
        }

        .site-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 80px; 
            gap: 20px;
            flex-wrap: wrap;
        }

        .site-header .brand {
            text-align: left;
        }

        .site-header .brand-link {
            display: inline-block;
            text-decoration: none;
            color: inherit;
        }

        .site-header h1 {
            font-size: 2.5rem;
            font-weight: 500;
            margin-bottom: 5px; 
        }

        .site-header p {
            font-size: 1.2rem;
            color: #666666; 
        }

        .site-nav {
            display: flex;
            gap: 30px;
            flex-wrap: wrap;
        }

        .site-nav a {
            text-decoration: none;
            color: #333333;
            font-size: 1rem;
            letter-spacing: 0.03em;
            text-transform: uppercase;
            transition: color 0.2s ease;
        }

        .site-nav a:hover {
            color: #999999;
        }

        /* Hamburger menu button (mobile only) */
        .menu-toggle {
            display: none;
            flex-direction: column;
            justify-content: center;
            gap: 5px;
            width: 30px;
            height: 24px;
            background: none;
            border: none;
            padding: 0;
            cursor: pointer;
            z-index: 1000;
        }

        .menu-toggle span {
            display: block;
            width: 100%;
            height: 2px;
            background-color: #333333;
        }

        /* Mobile nav panel: 70% width, full height, slides in from left */
        .mobile-nav-panel {
            position: fixed;
            top: 0;
            left: 0;
            width: 70%;
            height: 100%;
            background-color: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            transform: translateX(-100%);
            transition: transform 0.3s ease;
            z-index: 1002;
            display: flex;
            flex-direction: column;
            justify-content: center;
            gap: 30px;
            padding: 40px;
        }

        .mobile-nav-panel.is-open {
            transform: translateX(0);
        }

        .mobile-nav-panel a {
            text-decoration: none;
            color: #333333;
            font-size: 1.5rem;
            letter-spacing: 0.03em;
            text-transform: uppercase;
        }

        /* Scrim covers the remaining 30% (and everywhere else) so a click
           outside the panel closes it. Left transparent, not visually opaque,
           so the page behind stays visible. */
        .mobile-nav-scrim {
            position: fixed;
            inset: 0;
            background: transparent;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
            z-index: 1001;
        }

        .mobile-nav-scrim.is-open {
            opacity: 1;
            pointer-events: auto;
        }

        @media (max-width: 600px) {
            body {
                padding: 20px;
            }
            .site-header {
                flex-direction: row;
                justify-content: space-between;
                align-items: center;
                margin-bottom: 40px;
            }
            .site-nav {
                display: none;
            }
            .menu-toggle {
                display: flex;
                margin-left: auto;
            }
        }

        .pswp {
            --pswp-bg: #ffffff; 
            --pswp-icon-color: #333333; 
            --pswp-icon-color-secondary: #666666; 
        }
        .pswp__img, 
        .pswp__img--placeholder {
            background-color: #ffffff !important;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        
        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr); 
            gap: 20px; 
        }

        .gallery-grid a {
            display: block;
            aspect-ratio: 1 / 1; 
            overflow: hidden; 
            background-color: #ffffff; 
        }
        .gallery-grid a:focus,
        .gallery-grid a:active {
            outline: none;
            -webkit-tap-highlight-color: transparent; 
        }

        .gallery-grid img {
            width: 100%;
            height: 100%;
            object-fit: cover; 
            transition: transform 0.3s ease; 
        }

        @media (max-width: 900px) {
            .gallery-grid { grid-template-columns: repeat(2, 1fr); }
        }
        @media (max-width: 600px) {
            .gallery-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <header class="site-header">
        <div class="brand">
            <a href="index.html" class="brand-link">
                <h1>Zara Poon</h1>
            </a>
        </div>
        <button class="menu-toggle" id="menuToggle" aria-label="Open menu" aria-expanded="false">
            <span></span>
            <span></span>
            <span></span>
        </button>
        <nav class="site-nav">
            <a href="paintings.html">Paintings</a>
            <a href="photography.html">Photography</a>
            <a href="exhibitions.html">Exhibitions</a>
            <a href="projects.html">Projects</a>
        </nav>
    </header>

    <div class="mobile-nav-scrim" id="mobileNavScrim"></div>
    <nav class="mobile-nav-panel" id="mobileNavPanel">
        <a href="paintings.html">Paintings</a>
        <a href="photography.html">Photography</a>
        <a href="exhibitions.html">Exhibitions</a>
        <a href="projects.html">Projects</a>
    </nav>

    <div class="container">
        
        <div class="gallery-grid" id="my-gallery">
            
            <!-- href is the large image for the lightbox. data-pswp-width/height are REQUIRED by PhotoSwipe -->
            <a href="media/contact-for-web2000x2000.png" data-pswp-width="2616" data-pswp-height="2616" target="_blank">
                <!-- src is the thumbnail displayed on the page -->
                <img src="media/contact-for-web.png" alt="Description of image 1" />
            </a>

            <a href="media/khora-for-web2000x2000.png" data-pswp-width="2616" data-pswp-height="2616" target="_blank">
                <img src="media/khora-for-web.png" alt="Description of image 2" />
            </a>

            <a href="media/MagicEraser_260717_112449-2000x2000.jpeg" data-pswp-width="2616" data-pswp-height="2616" target="_blank">
                <img src="media/MagicEraser_260717_112449.jpeg" alt="Description of image 3" />
            </a>
           
            <a href="media/soft-s-for-web2000x2000.png" data-pswp-width="2616" data-pswp-height="2616" target="_blank">
                <img src="media/soft-s-for-web.png" alt="Description of image 3" />
            </a>


        </div>
    </div>

    <!-- PhotoSwipe JavaScript -->
    <script type="module">
        import PhotoSwipeLightbox from 'https://unpkg.com/photoswipe@5/dist/photoswipe-lightbox.esm.js';
        
        const lightbox = new PhotoSwipeLightbox({
            gallery: '#my-gallery',
            children: 'a',
            zoom: false,
            counter: false,
            bgOpacity: 1, 
            pswpModule: () => import('https://unpkg.com/photoswipe@5/dist/photoswipe.esm.js'),
            mainClass: 'pswp-with-perma-preloader',
            imageClickAction: 'close',   
            tapAction: 'close',          
            doubleTapAction: 'none',     
            showAnimationDuration: 250,
            hideAnimationDuration: 250
        });
        
        lightbox.init();
    </script>

    <!-- Mobile nav toggle -->
    <script>
        const menuToggle = document.getElementById('menuToggle');
        const mobileNavPanel = document.getElementById('mobileNavPanel');
        const mobileNavScrim = document.getElementById('mobileNavScrim');

        function openMobileNav() {
            mobileNavPanel.classList.add('is-open');
            mobileNavScrim.classList.add('is-open');
            menuToggle.setAttribute('aria-expanded', 'true');
        }

        function closeMobileNav() {
            mobileNavPanel.classList.remove('is-open');
            mobileNavScrim.classList.remove('is-open');
            menuToggle.setAttribute('aria-expanded', 'false');
        }

        menuToggle.addEventListener('click', () => {
            const isOpen = mobileNavPanel.classList.contains('is-open');
            isOpen ? closeMobileNav() : openMobileNav();
        });

        mobileNavScrim.addEventListener('click', closeMobileNav);
    </script>
</body>
</html>
